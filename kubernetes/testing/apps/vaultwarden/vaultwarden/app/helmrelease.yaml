---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: vaultwarden
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  values:

    controllers:
      main:
        type: deployment
        containers:
          main:
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.36.0-alpine@sha256:d3531610b486905943706b235e97159331801c6856e1367a93a5905e2b40f204
            env:
              TZ: America/Detroit
              SIGNUPS_ALLOWED: "false"
              SHOW_PASSWORD_HINT: "false"
              DOMAIN: https://vault.zynthovian.xyz
              ADMIN_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: vaultwarden-secret
                    key: admin-token

    persistence:
      data:
        enabled: true
        existingClaim: vaultwarden
        globalMounts:
          - path: '/data'

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            port: 80

    route:
      main:
        hostnames:
          - "{{ .Release.Name }}.zynthovian.xyz"
        parentRefs:
          - name: envoy-internal
            namespace: network