---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.36.0/mutatingadmissionpolicybinding-admissionregistration-v1.json
# Opts ${APP} into ../../apps/volsync-system/volsync/app/hold-until-restored-policy.yaml:
# ${APP}'s Deployment is held at 0 replicas for as long as ${APP}-dst
# (this component's ReplicationDestination) reports a pending, unfulfilled
# manual restore trigger. See ./README.md.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: hold-${APP}-until-restored
spec:
  policyName: hold-until-restored
  paramRef:
    name: ${APP}-dst
    namespace: ${APP_NAMESPACE}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ${APP_NAMESPACE}
    objectSelector:
      matchLabels:
        app.kubernetes.io/instance: ${APP}
