---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
spec:
  interval: 1h
  path: ./kubernetes/main/apps/longhorn-system/longhorn/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-flux-public
    namespace: flux-system
  targetNamespace: longhorn-system
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config-patches
spec:
  interval: 1h
  path: ./kubernetes/main/apps/longhorn-system/longhorn/patches
  prune: true
  dependsOn:
    - name: longhorn
  sourceRef:
    kind: GitRepository
    name: cluster-flux-public
    namespace: flux-system
  targetNamespace: longhorn-system
  patches:
    - target:
        kind: Node
        group: longhorn.io
        version: v1beta2
        name: amd64-server-7f97c6
      patch: |-
        apiVersion: longhorn.io/v1beta2
        kind: Node
        metadata:
          name: amd64-server-7f97c6
        spec:
          disks:
            EVO-970-2TiB:
              allowScheduling: true
              evictionRequested: false
              path: /var/mnt/longhorn
              storageReserved: 0
              tags: []
    - target:
        kind: Node
        group: longhorn.io
        version: v1beta2
        name: amd64-server-a2e7bb
      patch: |-
        apiVersion: longhorn.io/v1beta2
        kind: Node
        metadata:
          name: amd64-server-a2e7bb
        spec:
          disks:
            EVO-970-2TiB:
              allowScheduling: true
              evictionRequested: false
              path: /var/mnt/longhorn
              storageReserved: 0
              tags: []
    - target:
        kind: Node
        group: longhorn.io
        version: v1beta2
        name: amd64-server-b5915c
      patch: |-
        apiVersion: longhorn.io/v1beta2
        kind: Node
        metadata:
          name: amd64-server-b5915c
        spec:
          disks:
            EVO-970-2TiB:
              allowScheduling: true
              evictionRequested: false
              path: /var/mnt/longhorn
              storageReserved: 0
              tags: []