# Rotates openbao-k8s-broker's token daily so nothing static/long-lived
# sits in OpenBao's kubernetes secrets engine config. Needs
# alpine/k8s (kubectl + curl + jq bundled) — pin this to a digest before
# relying on it; left floating here because no digest was looked up
# against a registry for this branch.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-broker-token-rotate
spec:
  schedule: "17 3 * * *" # once daily; must stay well under the token's own max TTL
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: openbao-token-rotator
          restartPolicy: Never
          automountServiceAccountToken: true
          volumes:
            - name: ca
              configMap:
                name: openbao-ca
          containers:
            - name: rotate
              image: alpine/k8s:1.30.4 # verify/pin digest before relying on this
              volumeMounts:
                - name: ca
                  mountPath: /etc/openbao
                  readOnly: true
              env:
                - name: OPENBAO_ADDR
                  value: "https://xenia.zynthovian.xyz:8200"
                - name: KUBE_SA_TOKEN_PATH
                  value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
              command:
                - /bin/sh
                - -euc
                - |
                  # 1. Authenticate to OpenBao as *this* pod (openbao-token-rotator),
                  #    via the same auth/kubernetes method external-secrets already uses.
                  #    jq --rawfile builds the JSON payload so the JWT is escaped
                  #    correctly rather than hand-interpolated into a string.
                  LOGIN_PAYLOAD="$(jq -n --rawfile jwt "$KUBE_SA_TOKEN_PATH" \
                    '{role: "k8s-broker-rotator", jwt: $jwt}')"
                  VAULT_TOKEN="$(curl -sf --cacert /etc/openbao/ca.crt \
                    --request POST --data "$LOGIN_PAYLOAD" \
                    "$OPENBAO_ADDR/v1/auth/kubernetes/login" | jq -r '.auth.client_token')"

                  # 2. Mint a fresh token for openbao-k8s-broker — the *only*
                  #    ServiceAccount this pod's own RBAC lets it request one for.
                  NEW_JWT="$(kubectl create token openbao-k8s-broker -n kube-system --duration=48h)"

                  # 3. Push it into the kubernetes secrets engine's config, re-sending
                  #    kubernetes_ca_cert every time: OpenBao's config write replaces
                  #    the whole object, not a partial patch — omitting it here would
                  #    silently wipe OpenBao's trust of the apiserver's TLS cert.
                  #    That CA is the *cluster's* CA (mounted into every pod), not
                  #    OpenBao's own TLS CA (the --cacert flag above) — two different
                  #    CAs serving two different trust relationships in this script.
                  CONFIG_PAYLOAD="$(jq -n \
                    --rawfile ca /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                    --arg jwt "$NEW_JWT" \
                    '{kubernetes_host: "https://k8s.zynthovian.xyz:6443", kubernetes_ca_cert: $ca, service_account_jwt: $jwt}')"
                  curl -sf --cacert /etc/openbao/ca.crt \
                    --header "X-Vault-Token: $VAULT_TOKEN" \
                    --request POST --data "$CONFIG_PAYLOAD" \
                    "$OPENBAO_ADDR/v1/k8s-broker/config"
