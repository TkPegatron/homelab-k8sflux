---
# The CronJob's own identity (distinct from openbao-k8s-broker). It can
# mint a *fresh* token for openbao-k8s-broker (and nothing else), and
# authenticates to OpenBao using this cluster's existing auth/kubernetes
# method — the same mechanism external-secrets already uses — rather
# than holding any Vault credential of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-token-rotator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-token-rotator
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames:
      - openbao-k8s-broker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-token-rotator
subjects:
  - kind: ServiceAccount
    name: openbao-token-rotator
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: openbao-token-rotator
  apiGroup: rbac.authorization.k8s.io
