---
# The identity OpenBao's Kubernetes secrets engine itself uses to reach
# this cluster's TokenRequest API and mint tokens for oidc-broker-admin
# / oidc-broker-viewer. Deliberately scoped to *only* those two names
# via resourceNames — this cannot mint a token for any other
# ServiceAccount in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-k8s-broker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-k8s-broker
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames:
      - oidc-broker-admin
      - oidc-broker-viewer
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
    resourceNames:
      - oidc-broker-admin
      - oidc-broker-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-k8s-broker
subjects:
  - kind: ServiceAccount
    name: openbao-k8s-broker
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: openbao-k8s-broker
  apiGroup: rbac.authorization.k8s.io
