---
# The two RBAC tiers OpenBao's Kubernetes secrets engine mints
# short-lived tokens for (see ../README.md). Each is a normal
# ServiceAccount + ClusterRoleBinding — the actual access grant lives
# here in git, reviewable like anything else. OpenBao never decides
# *what* a token can do, only *whether* to hand one out and for how
# long; RBAC still decides what it's good for once issued.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oidc-broker-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-broker-admin
subjects:
  - kind: ServiceAccount
    name: oidc-broker-admin
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oidc-broker-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-broker-viewer
subjects:
  - kind: ServiceAccount
    name: oidc-broker-viewer
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
