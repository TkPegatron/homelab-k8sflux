---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    autoDirectNodeRoutes: true
    bandwidthManager:
      enabled: true
      bbr: true
    bpf:
      datapathMode: netkit
      masquerade: true
      preallocateMaps: true
    bpfClockProbe: true
    bgpControlPlane:
      enabled: true
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cni:
      exclusive: false
    dashboards:
      enabled: true
    devices: bond0
    enableIPv4BIGTCP: true
    encryption:
      # Transparent WireGuard encryption for pod-to-pod traffic that
      # crosses node boundaries (host-to-host on the wire). Requires
      # in-kernel WireGuard support (Talos ships this by default).
      #
      # Known caveats to verify against this exact stack before promoting
      # past `kubernetes/testing`:
      #  - cilium/cilium#45950: pod -> local-node-IP can fail under
      #    encryption.type=wireguard in some 1.19 configs.
      #  - With loadBalancer.mode: dsr (as set below), north-south traffic
      #    redirected between nodes in non-Geneve DSR dispatch isn't
      #    encrypted by this feature — only east-west pod-to-pod is
      #    guaranteed here.
      #  - Interaction with bpf.datapathMode: netkit hasn't been verified
      #    against your Cilium version; watch `cilium encrypt status` on
      #    each node after rollout.
      enabled: true
      type: wireguard
      # Only encrypts pod-to-pod. Set to true for node-to-node/pod-to-node
      # too (kubelet health checks, etc.) once pod-to-pod is confirmed
      # working.
      nodeEncryption: false
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    hubble:
      enabled: true
      # Relay/UI are deployed separately (see ../hubble/app/helmrelease.yaml)
      # so bootstrap doesn't wait on Hubble pods to become Ready before the
      # CNI those pods themselves depend on has finished coming up.
      relay:
        enabled: false
      ui:
        enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 10.42.0.0/16
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: false
    loadBalancer:
      algorithm: maglev
      mode: dsr
    localRedirectPolicies:
      enabled: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 1
      rollOutPods: true
    pmtuDiscovery:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      enabled: true
      hostNamespaceOnly: true