---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.36.0/mutatingadmissionpolicy-admissionregistration-v1.json
# Forces spec.replicas to 0 on a Deployment whenever its paired
# ReplicationDestination has a pending manual restore trigger that hasn't
# completed yet (spec.trigger.manual set, but status.lastManualSync
# doesn't match it) — see ../../../../components/volsync/README.md for
# the full explanation and ../../../../components/volsync/mutatingadmissionpolicybinding.yaml
# for how each app opts in.
#
# This is the same primitive as ../../kube-system/pod-admission-policy/
# and ../../o11y/grafana-operator/instance/mutatingadmissionpolicy.yaml —
# native CEL, no extra controller.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: hold-until-restored
spec:
  paramKind:
    apiVersion: volsync.backube/v1alpha1
    kind: ReplicationDestination
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: restore-not-yet-fulfilled
      expression: >-
        has(params.spec.trigger) && has(params.spec.trigger.manual) &&
        params.spec.trigger.manual != "" &&
        (!has(params.status) || !has(params.status.lastManualSync) ||
         params.status.lastManualSync != params.spec.trigger.manual)
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op: "replace", path: "/spec/replicas", value: 0}]
